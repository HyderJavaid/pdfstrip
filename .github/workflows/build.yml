name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc, so the binary runs on more distros
            asset: pdfstrip-linux-x86_64
          - os: windows-latest
            asset: pdfstrip-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # needed to attach files to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements-build.txt
      - run: pyinstaller packaging/pdfstrip.spec
      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/pdfstrip.exe "dist/${{ matrix.asset }}"; else mv dist/pdfstrip "dist/${{ matrix.asset }}"; fi
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # The app should start and stay up for a few seconds without crashing.
          xvfb-run -a timeout 8 "dist/${{ matrix.asset }}" || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

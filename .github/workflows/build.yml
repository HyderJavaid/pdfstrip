name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc, so the binary runs on more distros
            asset: StripSafe-linux-x86_64
          - os: windows-latest
            asset: StripSafe-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # needed to attach files to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1
          libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0
          libxcb-xinerama0 libxcb-xkb1
      - run: pip install -r requirements-build.txt
      - run: pyinstaller packaging/stripsafe.spec
      - name: Rename binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/StripSafe.exe "dist/${{ matrix.asset }}"; else mv dist/StripSafe "dist/${{ matrix.asset }}"; fi
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # The app should start and stay up for a few seconds without crashing.
          xvfb-run -a timeout 8 "dist/${{ matrix.asset }}" || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
